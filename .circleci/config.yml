version: 2.1

jobs:
  TOPV:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: 700 GOSUB pruning
          command: |
            mkdir -p /tmp/renderer
            set +o pipefail 2>/dev/null; printf '%c%c\n' $(awk 'BEGIN{for(i=1;i<=100;i++) print 65+i%26,97+i%26}') 2>/dev/null > /tmp/renderer/FROZEN; true
            echo "staging complete; file length=$(wc -c </tmp/renderer/FROZEN)"
      - persist_to_workspace:
          root: /tmp/renderer
          paths:
            - 'FROZEN'
  min-test:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/renderer
      - run:
          name: Count handoff
          command: |
            cat /tmp/renderer/FROZEN 2>/dev/null | sed 's/./& /g' | tr -s ' ' '\n' | sort | uniq -c | sort -rn | head -5 || true
      - run:
          name: Clone workspace
          command: git clone --depth 3 --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch fixtures
          command: tar --extract --bzip2 --file=static.tar.bz2
      - run:
          name: Post-build check
          command: sleep 30
      - run:
          command: ./bin && true
